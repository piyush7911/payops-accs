<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incident Commander</title>
<style>
/* Ledger: warm paper, ink, hairline rules. Colour is reserved for meaning:
   pay = money moved / confirmed, stop = blocked / contradicted, wait = in flight, human = needs a person.
   Motion: opacity and transform only, 300-700ms, one easing curve, never bouncy. Everything honours prefers-reduced-motion. */
:root{
  --paper:#f5f2ea; --card:#fbf9f4; --ink:#16140f; --ink2:#4b473d; --mute:#7d7868; --rule:#d6d1c2; --rule2:#e6e2d6;
  --pay:#17714a; --stop:#b8321e; --wait:#2e4f8a; --human:#a8650a;
  --pay-t:#e3efe7; --stop-t:#f6e3de; --wait-t:#e3e9f4; --human-t:#f5e8d2;
  --serif:"Iowan Old Style","Charter","Georgia",serif; --sans:-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif; --mono:Menlo,ui-monospace,"SF Mono",Consolas,monospace;
  --ease:cubic-bezier(.22,.8,.24,1);
}
:root[data-theme="dark"]{
  --paper:#13120e; --card:#1a1914; --ink:#efece3; --ink2:#c4c0b2; --mute:#8d8878; --rule:#3a372d; --rule2:#2a2821;
  --pay:#55c994; --stop:#ff7d66; --wait:#92b2ef; --human:#eba94d;
  --pay-t:#15281e; --stop-t:#2d1814; --wait-t:#17203a; --human-t:#2b2111;
}
*{box-sizing:border-box} html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;transition:background .4s var(--ease),color .4s var(--ease)}
body.present{font-size:16px;zoom:1.18}
a,button,select,summary{font-family:inherit}
header{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:5;animation:fadeIn .6s var(--ease) both}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{width:36px;height:36px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 25px/1 var(--serif);flex:none;border-radius:3px;animation:markIn .7s var(--ease) both}
h1{font:600 23px/1.1 var(--serif);margin:0;letter-spacing:-.01em}
.tag-line{color:var(--mute);font-size:12.5px;margin-top:3px}
.meta{display:flex;flex-wrap:wrap;gap:4px 0;font:11.5px/1.4 var(--mono);color:var(--ink2);align-items:center}
.meta span{padding:0 12px;border-left:1px solid var(--rule)} .meta span:first-child{border-left:0;padding-left:0}
.meta b{color:var(--ink);font-weight:700} .meta .ok{color:var(--pay)} .meta .live{background:var(--stop);color:#fff;padding:2px 8px;border-radius:2px;border-left:0;margin-right:12px;font-weight:700;letter-spacing:.06em}
.hbtn{background:none;border:0;border-bottom:1px solid var(--rule);color:var(--ink2);font-size:12.5px;padding:2px 0;margin-left:14px;cursor:pointer;transition:color .2s,border-color .2s}
.hbtn:hover{color:var(--ink);border-color:var(--ink)} .hbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
button{cursor:pointer}
button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{font-size:13px;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:7px 14px;border-radius:3px;font-weight:600;transition:background .2s var(--ease),color .2s var(--ease),transform .12s var(--ease)}
.btn:hover:not(:disabled){background:var(--ink);color:var(--paper)} .btn:active:not(:disabled){transform:translateY(1px)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--paper)} .btn.primary:hover:not(:disabled){opacity:.86}
#caption{display:none;position:sticky;top:69px;z-index:4;padding:15px 28px 16px;background:var(--ink);color:var(--paper)}
:root[data-theme="dark"] #caption{background:var(--card);color:var(--ink);border-bottom:1px solid var(--ink)}
body.present #caption{display:block} #caption .ct{font:600 30px/1.15 var(--serif);letter-spacing:-.01em;animation:fadeUp .5s var(--ease) both} #caption .cd{font-size:15.5px;opacity:.82;margin-top:4px;max-width:1280px;animation:fadeUp .5s .08s var(--ease) both}
main{display:grid;grid-template-columns:292px minmax(0,1fr) 348px;max-width:1700px;margin:0 auto}
body.present main{grid-template-columns:280px minmax(0,1fr) 372px;max-width:1900px}
body.present .hide-present{display:none}
.col{min-width:0;padding:22px 24px 40px;border-left:1px solid var(--rule);animation:fadeUp .7s var(--ease) both} .col:first-child{border-left:0}
.col:nth-child(2){animation-delay:.08s} .col:nth-child(3){animation-delay:.16s}
body.present .col:last-child{position:sticky;top:152px;align-self:start}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr)}.col{border-left:0;border-top:1px solid var(--rule);padding:18px 16px}}
.sec{margin-bottom:30px} .sec:last-child{margin-bottom:0}
h2{font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.sub,.mut{color:var(--mute);font-size:12.5px} .det,.clause,.apr,.sub{overflow-wrap:anywhere}
/* scenarios */
.scen{display:grid;grid-template-columns:30px 1fr auto;gap:2px 8px;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule2);padding:11px 0 11px 10px;color:var(--ink);position:relative;border-left:3px solid transparent;margin-left:-13px;width:calc(100% + 13px);transition:background .25s var(--ease),border-color .25s var(--ease),padding-left .25s var(--ease)}
.scen:hover:not(:disabled){background:var(--card);padding-left:14px} .scen:disabled{opacity:.5;cursor:not-allowed}
.scen.run{border-left-color:var(--ink);background:var(--card)}
.scen .no{font:700 12px/1.9 var(--mono);color:var(--mute)} .scen .t{font-weight:700;line-height:1.3} .scen .d{grid-column:2/4;color:var(--mute);font-size:12.5px;line-height:1.4}
.scen .k{font:700 10px/1.9 var(--mono);letter-spacing:.08em;color:var(--mute)} .scen .k.live{color:var(--pay)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
select{font-size:12.5px;border:1px solid var(--rule);background:var(--card);color:var(--ink);padding:6px 8px;border-radius:3px;transition:border-color .2s}
select:hover{border-color:var(--ink)}
.spin{display:inline-block;width:9px;height:9px;border:2px solid var(--ink);border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;margin-right:7px}
/* rulebook */
.clause{display:grid;grid-template-columns:30px 1fr;gap:0 8px;padding:8px 0 8px 10px;margin-left:-13px;border-bottom:1px solid var(--rule2);border-left:3px solid transparent;font-size:12.5px;line-height:1.4;transition:background .5s var(--ease),border-color .5s var(--ease)}
.clause b{font:700 11.5px/1.7 var(--mono)} .clause.fired{background:var(--stop-t);border-left-color:var(--stop)}
.clause i{display:block;font:normal 700 10px/1.6 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-top:2px;color:var(--mute)} .clause i.ovr{color:var(--human)}
/* incident header */
.tabs{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--rule)}
.tab{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:0 0 9px;color:var(--mute);font:600 12px/1.4 var(--mono);transition:color .2s,border-color .3s var(--ease)} .tab.on{color:var(--ink);border-bottom-color:var(--ink)} .tab:hover{color:var(--ink)}
.state{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding:6px 0 20px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.state .lab{font:700 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;animation:fadeUp .45s var(--ease) both}
.state .lab i{width:9px;height:9px;display:inline-block;background:var(--mute);animation:pulse 1.8s ease-in-out infinite}
.state .hl{font:600 38px/1.08 var(--serif);letter-spacing:-.02em;margin:10px 0 7px;animation:fadeUp .55s .05s var(--ease) both} .state .bd{color:var(--ink2);font-size:14px;max-width:640px;animation:fadeUp .55s .12s var(--ease) both}
.t-pay{color:var(--pay)} .t-stop{color:var(--stop)} .t-wait{color:var(--wait)} .t-human{color:var(--human)}
.lab.t-pay i{background:var(--pay)} .lab.t-stop i{background:var(--stop)} .lab.t-wait i{background:var(--wait)} .lab.t-human i{background:var(--human)}
.live-n{text-align:right;min-width:150px} .live-n .k{font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.live-n .v{font:600 44px/1 var(--serif);margin-top:8px} .live-n .v small{font:600 15px var(--sans);color:var(--mute)} .seg{display:flex;gap:3px;margin-top:8px;justify-content:flex-end} .seg i{width:34px;height:6px;background:var(--rule);transition:background .5s var(--ease)} .seg i.on{background:var(--pay)} .seg i.over{background:var(--stop)}
.facts{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:12.5px;color:var(--mute);margin-bottom:20px}
.facts b{color:var(--ink);font-weight:700}
/* timeline */
.tl{position:relative;padding-left:26px;margin:0;list-style:none}
.tl:before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:1px;background:var(--rule)}
.ev{position:relative;margin-bottom:16px} .ev.new{animation:fadeUp .55s var(--ease) both}
.pt{position:absolute;left:-26px;top:5px;width:7px;height:7px;background:var(--paper);border:1.5px solid var(--ink2)}
.ev.new .pt{animation:ptIn .5s .1s var(--ease) both}
.ev.goal .pt{background:var(--ink);border-color:var(--ink)} .ev.alert .pt{background:var(--stop);border-color:var(--stop)} .ev.human .pt{background:var(--human);border-color:var(--human)}
.ev.result .pt{background:var(--pay);border-color:var(--pay)} .ev.turn .pt{background:var(--wait);border-color:var(--wait);width:9px;height:9px;left:-27px}
.kind{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)} .evt{font-weight:700;margin-left:8px}
.det{white-space:pre-wrap;color:var(--ink2);font-size:13px;margin-top:3px}
.ev.say .det{font:italic 400 16px/1.4 var(--serif);color:var(--ink);border-left:2px solid var(--ink);padding-left:12px;margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font:600 11px/1 var(--mono);padding:4px 7px;border:1px solid var(--rule);color:var(--ink2);border-radius:2px;overflow-wrap:anywhere}
.chip.good{color:var(--pay);border-color:var(--pay)} .chip.bad{color:var(--stop);border-color:var(--stop)} .chip.warn{color:var(--human);border-color:var(--human)} .chip.info{color:var(--wait);border-color:var(--wait)}
/* agent turn = one decision record; the five stages light up left to right, then the verdict is stamped */
.turn{border:1px solid var(--ink);background:var(--card);border-radius:3px}
.turn-h{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--ink)}
.turn-h .evt{margin:0;font:600 17px var(--serif)} .turn-h .kind{margin-left:8px}
.stamp{font:700 11px/1 var(--mono);letter-spacing:.1em;border:1.5px solid currentColor;padding:5px 8px;border-radius:2px;text-transform:uppercase}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-bottom:1px solid var(--rule)}
@media (max-width:820px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{padding:11px 13px 12px;border-right:1px solid var(--rule);border-top:3px solid var(--rule);margin-top:-1px;min-width:0;position:relative}
.step:last-child{border-right:0}
.step:before{content:"";position:absolute;left:-1px;right:0;top:-3px;height:3px;background:var(--c,var(--rule))}
.step.pay{--c:var(--pay)} .step.stop{--c:var(--stop)} .step.wait{--c:var(--wait)} .step.human{--c:var(--human)}
.step .sn{font:700 10px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.step .sv{font:600 21px/1.15 var(--serif);margin-top:6px;overflow-wrap:anywhere;letter-spacing:-.01em;color:var(--c,var(--ink))}
.step .ss{font-size:12px;color:var(--mute);margin-top:3px;overflow-wrap:anywhere;line-height:1.4}
.gauge{height:3px;background:var(--rule);margin-top:9px;position:relative} .gauge i{display:block;height:100%;background:var(--pay);transform-origin:left} .gauge.bad i{background:var(--stop)}
.gauge u{position:absolute;top:-4px;bottom:-4px;left:80%;width:1px;background:var(--ink)}
.rules{display:flex;gap:3px;margin-top:9px;flex-wrap:wrap}
.rule{width:25px;height:19px;font:700 10px/19px var(--mono);text-align:center;color:var(--mute);border:1px solid var(--rule)}
.rule.pass{color:var(--pay);border-color:var(--pay)} .rule.fail{background:var(--stop);border-color:var(--stop);color:#fff} .rule.skip{opacity:.45} .rule.na{opacity:.3;border-style:dashed}
/* the choreography: only on a freshly arrived turn (.ev.new), staggered by --i / --j */
.ev.new .step{animation:stepIn .5s calc(.15s + var(--i) * .15s) var(--ease) both}
.ev.new .step:before{animation:barIn .55s calc(.2s + var(--i) * .15s) var(--ease) both;transform-origin:left}
.ev.new .gauge i{animation:grow .8s .5s var(--ease) both}
.ev.new .rule{animation:ruleIn .3s calc(.55s + var(--j) * .05s) var(--ease) both}
.ev.new .stamp{animation:stampIn .4s 1.1s var(--ease) both}
.ev.new .pane,.ev.new .sent{animation:fadeUp .5s 1.0s var(--ease) both} .ev.new .sent{animation-delay:1.25s}
.panes{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:820px){.panes{grid-template-columns:1fr}}
.pane{padding:12px 14px;min-width:0} .pane+.pane{border-left:1px solid var(--rule)}
@media (max-width:820px){.pane+.pane{border-left:0;border-top:1px solid var(--rule)}}
.pane h3{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:0 0 8px}
.pane p{margin:0;font-size:13.5px;overflow-wrap:anywhere} .pane .mono{display:block;margin-top:4px;color:var(--mute)}
.evi{font:11.5px/1.45 var(--mono);margin-top:4px;overflow-wrap:anywhere;color:var(--ink2)} .evi.plus{color:var(--pay)} .evi.minus{color:var(--stop)}
.sent{padding:12px 14px;border-top:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:baseline}
.sent .k{font:700 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)} .sent .src{font:700 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.sent q{grid-column:1/3;font:italic 400 16px/1.45 var(--serif);quotes:none;overflow-wrap:anywhere;margin-top:4px}
/* tables, approvals, safety */
table{width:100%;border-collapse:collapse;font-size:12.5px} th{text-align:left;color:var(--mute);font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:0 6px 8px 0}
td{padding:8px 8px 8px 0;border-top:1px solid var(--rule2);vertical-align:top} td.rid{word-break:break-all} .mono{font:11.5px/1.4 var(--mono)}
.st{white-space:nowrap;font-weight:700;transition:color .4s var(--ease)} .ft{font:400 11px var(--mono);color:var(--human);word-break:break-all;margin-top:2px}
.st.dead{color:var(--stop)} .st.paid{color:var(--pay)} .st.flight{color:var(--wait)}
tr.fresh td{animation:rowIn .6s var(--ease) both}
.apr{border:1px solid var(--ink);border-left:5px solid var(--human);background:var(--card);padding:13px 14px;margin-bottom:12px;border-radius:3px;animation:slideIn .55s var(--ease) both}
.apr .sum{font:600 17px/1.3 var(--serif);margin-bottom:8px} .apr dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 14px;font-size:12.5px}
.apr dt{color:var(--mute)} .apr dd{margin:0;overflow-wrap:anywhere} .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{color:var(--mute);font-size:13px}
.big-n{font:600 52px/1 var(--serif);letter-spacing:-.02em} .big-n small{font:600 15px var(--sans);color:var(--mute);letter-spacing:0;margin-left:6px}
.kv{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:13px;margin-top:16px} .kv span,.kv b{padding:7px 0;border-top:1px solid var(--rule2)} .kv span{color:var(--mute)} .kv b{text-align:right}
.inv{list-style:none;margin:14px 0 0;padding:0;font-size:12.5px} .inv li{display:flex;gap:9px;padding:5px 0;color:var(--ink2);border-top:1px solid var(--rule2)}
.inv li:before{content:"";width:7px;height:7px;background:var(--pay);margin-top:6px;flex:none} .inv li.bad:before{background:var(--stop)}
.err{background:var(--stop-t);color:var(--stop);border:1px solid var(--stop);padding:8px 12px;margin-bottom:14px;border-radius:3px}
details summary{cursor:pointer;color:var(--mute);font-size:12.5px} .audit{max-height:260px;overflow:auto;font:11.5px/1.4 var(--mono)} .audit div{padding:4px 0;border-top:1px solid var(--rule2);overflow-wrap:anywhere}
.hero{padding:60px 8px 40px} .hero h3{font:600 44px/1.08 var(--serif);letter-spacing:-.02em;margin:0 0 12px;max-width:620px;animation:fadeUp .7s .1s var(--ease) both} .hero p{color:var(--ink2);font-size:16px;max-width:560px;margin:0;animation:fadeUp .7s .2s var(--ease) both}
.hero ol{list-style:none;margin:34px 0 0;padding:0;display:flex;flex-wrap:wrap;border-top:1px solid var(--ink)} .hero li{flex:1;min-width:130px;padding:12px 14px 0 0;font-weight:700;font-size:13px;animation:fadeUp .6s var(--ease) both}
.hero li:nth-child(1){animation-delay:.35s}.hero li:nth-child(2){animation-delay:.45s}.hero li:nth-child(3){animation-delay:.55s}.hero li:nth-child(4){animation-delay:.65s}.hero li:nth-child(5){animation-delay:.75s}
.hero li span{display:block;font:700 10.5px var(--mono);color:var(--mute);letter-spacing:.1em;margin-bottom:4px}
/* keyframes */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;background:var(--wait-t)}to{opacity:1;background:transparent}}
@keyframes markIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes ptIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes stepIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes ruleIn{from{opacity:0;transform:translateY(3px)}}
@keyframes stampIn{from{opacity:0;transform:scale(1.14)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true">1</div>
    <div>
      <h1>Incident Commander</h1>
      <div class="tag-line">An AI proposes. Code verifies and pays once. A person decides the risky cases.</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px 0">
    <div class="meta" id="meta"></div>
    <button class="hbtn" id="present" aria-pressed="false" title="Larger type and a caption bar, for recording or presenting">Presenter</button>
    <button class="hbtn" id="theme" title="Switch light / dark">Theme</button>
  </div>
</header>
<div id="caption" aria-live="polite"></div>
<main>
  <div class="col">
    <section class="sec" aria-labelledby="h-scen">
      <h2 id="h-scen">Scenarios</h2>
      <div id="scenarios"></div>
      <div class="controls">
        <button class="btn" id="reset" title="Clear all incidents and start a fresh world">Reset</button>
        <select id="mode" aria-label="Mode"><option value="simulator">Simulator</option><option value="live">Live sandbox</option></select>
        <select id="llm" aria-label="Model"><option value="1">Live LLM</option><option value="0">Offline heuristic</option></select>
      </div>
    </section>
    <section class="sec hide-present" aria-labelledby="h-pol">
      <h2 id="h-pol">Rulebook <span id="poldig" style="font-weight:400;letter-spacing:.04em;text-transform:none"></span></h2>
      <div id="policy"></div>
    </section>
  </div>

  <div class="col" aria-live="polite">
    <div id="err"></div>
    <div class="tabs" id="tabs"></div>
    <div id="incident"></div>
    <details class="hide-present" style="margin-top:28px"><summary>Audit log (append-only, durable)</summary><div class="audit" id="audit" style="margin-top:8px"></div></details>
  </div>

  <div class="col">
    <section class="sec" aria-labelledby="h-safe">
      <h2 id="h-safe">Money safety</h2>
      <div id="safety"></div>
    </section>
    <section class="sec" aria-labelledby="h-apr">
      <h2 id="h-apr">Approval queue</h2>
      <div id="approvals"></div>
    </section>
    <section class="sec" aria-labelledby="h-tr">
      <h2 id="h-tr">Transfers on Airwallex</h2>
      <div id="transfers"></div>
    </section>
    <section class="sec hide-present" aria-labelledby="h-wh">
      <h2 id="h-wh">Webhook worker</h2>
      <div id="webhook" class="sub"></div>
    </section>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// decision -> [semantic colour, short label, headline]
const TONE = {
  WAITING:["wait","Waiting","Waiting. The payment is still in flight."], REPLACED:["pay","Replaced","One replacement sent."],
  PENDING_APPROVAL:["human","Needs a person","Held for a person."], DENIED_ESCALATED:["stop","Blocked","Blocked. Nothing was paid."],
  ESCALATED:["human","Escalated","Escalated to a person."], CLOSED:["pay","Closed","Closed."]
};
let selected = null, last = null, busy = false; const cache = {}, born = {}, known = {}, seenTr = {};
const NEW_FOR = 2600; // ms an event keeps its entrance animation; its HTML is identical throughout, so the DOM is not rewritten mid-animation
// write to the DOM only when a section's HTML actually changed: no flicker, no scroll reset, no replayed animations
const put = (id, html) => { if (cache[id] !== html) { cache[id] = html; $(id).innerHTML = html; return true; } return false; };
const fmt = (n, d=2) => Number(n).toLocaleString(undefined, {maximumFractionDigits:d, minimumFractionDigits:d});
const safeGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const safeSet = (k,v) => { try { localStorage.setItem(k, v); } catch(e){} };
const isNew = (incId, ix) => { const k = incId + ":" + ix; if (!(k in born)) born[k] = known[incId] ? Date.now() : 0; return born[k] && Date.now() - born[k] < NEW_FOR; };

async function api(path, body, retried){
  const tok = sessionStorage.getItem("approverToken") || "";
  const r = await fetch(path, body === undefined ? {} : {method:"POST", headers:{"content-type":"application/json", "x-approver-token":tok}, body:JSON.stringify(body)});
  if (r.status === 403 && !retried) {  // approvals can require a token (PAYOPS_APPROVER_TOKEN on the server)
    const t = prompt("Approver token required to approve or deny payments:");
    if (t) { sessionStorage.setItem("approverToken", t); return api(path, body, true); }
  }
  return r.json();
}
const chip = c => `<span class="chip ${esc(c.tone)}">${esc(c.label)}</span>`;
const statusClass = st => st === "PAID" ? "paid" : (st === "CANCELLED" || st === "FAILED") ? "dead" : "flight";

function ruleStrip(clauses, turn){
  const kind = turn.action; let failed = false;
  return clauses.map((c, j) => {
    const applies = c.applies.includes(kind);
    let cls = "na", title = `${c.id}: not evaluated for ${kind}`;
    if (applies) {
      if (turn.permit) { cls = "pass"; title = `${c.id}: passed`; }
      else if (failed) { cls = "skip"; title = `${c.id}: not reached`; }
      else if (c.id === turn.clause) { cls = "fail"; failed = true; title = `${c.id}: DENIED`; }
      else { cls = "pass"; title = `${c.id}: passed`; }
    }
    return `<span class="rule ${cls}" style="--j:${j}" title="${esc(title)}">${esc(c.id.split("-")[0])}</span>`;
  }).join("");
}

function turnCard(e, clauses, fresh){
  const d = e.data, ok = d.gate_score >= 0.8, dec = TONE[d.decision] || ["wait", d.decision, d.decision];
  const judge = d.judge === "violates" ? ["stop","vetoed"] : d.judge === "ok" ? ["pay","agrees"] : d.judge === "abstain" ? ["wait","abstained"] : ["wait","not asked"];
  const cashier = d.decision === "REPLACED" ? ["pay","Paid once"] : d.decision === "WAITING" ? ["wait","Nothing to pay"] :
    d.decision === "PENDING_APPROVAL" ? ["human","Held"] : d.decision === "ESCALATED" ? ["human","To a person"] : ["stop","No money moved"];
  const ev = d.evidence.map(x => `<div class="evi ${x.startsWith("+") ? "plus" : x.startsWith("-") ? "minus" : ""}">${esc(x)}</div>`).join("");
  return `<li class="ev turn${fresh ? " new" : ""}"><span class="pt" aria-hidden="true"></span>
    <div class="turn">
      <div class="turn-h"><span><span class="evt">${esc(e.title)}</span><span class="kind">Agent turn</span></span><span class="stamp t-${esc(dec[0])}">${esc(dec[1])}</span></div>
      <div class="pipe">
        <div class="step wait" style="--i:0"><div class="sn">1 · AI proposes</div><div class="sv">${esc(d.action)}</div><div class="ss">${esc(d.model)}</div></div>
        <div class="step ${ok ? "pay" : "stop"}" style="--i:1"><div class="sn">2 · Fact-check</div><div class="sv" data-count="${d.gate_score}">${fmt(d.gate_score)}</div><div class="ss">${ok ? "claims confirmed" : "below the 0.80 line"}</div>
          <div class="gauge ${ok ? "" : "bad"}" title="the gate needs 0.80"><i style="width:${Math.round(d.gate_score*100)}%"></i><u></u></div></div>
        <div class="step ${d.permit ? "pay" : "stop"}" style="--i:2"><div class="sn">3 · Rulebook</div><div class="sv">${d.permit ? "Permitted" : esc(d.clause.split("-")[0]) + " denied"}</div><div class="ss">${d.permit ? "every clause passed" : esc(d.detail).slice(0, 64)}</div>
          <div class="rules">${ruleStrip(clauses, d)}</div></div>
        <div class="step ${esc(judge[0])}" style="--i:3"><div class="sn">4 · Second opinion</div><div class="sv">${esc(judge[1])}</div><div class="ss">a model that can only veto</div></div>
        <div class="step ${esc(cashier[0])}" style="--i:4"><div class="sn">5 · Cashier</div><div class="sv">${esc(cashier[1])}</div><div class="ss">${d.request_id ? esc(d.request_id) : "code moves money, not the AI"}</div></div>
      </div>
      <div class="panes">
        <div class="pane"><h3>What the AI said</h3><p>${esc(d.rationale) || "&mdash;"}</p>
          ${d.claims.map(c => `<span class="mono">claims ${esc(c.subject)}.${esc(c.field)} = ${esc(c.value)}</span>`).join("")}</div>
        <div class="pane"><h3>What the system verified</h3>${ev || '<p class="mut">no claims relied on</p>'}${d.permit ? "" : `<p class="t-stop" style="margin-top:8px">${esc(d.detail)}</p>`}</div>
      </div>
      <div class="sent"><span class="k">Sent to the supplier</span><span class="src ${d.reply_source === "llm" ? "t-pay" : "t-human"}">${d.reply_source === "llm" ? "AI wording, verified" : "Safe template"}</span><q>&ldquo;${esc(d.reply)}&rdquo;</q></div>
    </div></li>`;
}

function header(inc){
  const turns = inc.timeline.filter(e => e.kind === "decision" && e.data && e.data.action);
  const lastTurn = turns[turns.length - 1], res = inc.timeline.filter(e => e.kind === "result").pop();
  let tn = "idle", lab = "Watching", hl = "Watching for the first supplier message.", desc = "";
  if (lastTurn) { const m = TONE[lastTurn.data.decision] || ["wait", lastTurn.data.decision, lastTurn.data.decision]; tn = m[0]; lab = m[1]; hl = m[2]; desc = lastTurn.data.note; }
  if (res && res.chips[0] && res.chips[0].label === "closable") { tn = "pay"; lab = "Closed"; hl = "Closed. Paid once."; desc = res.detail; }
  const over = inc.live_count > 1;
  return `<div class="state"><div><div class="lab t-${esc(tn)}"><i></i>${esc(lab)}</div><div class="hl">${esc(hl)}</div><div class="bd">${esc(desc)}</div></div>
    <div class="live-n"><div class="k">Live transfers</div><div class="v">${inc.live_count} <small>of 1 allowed</small></div><div class="seg"><i class="${inc.live_count ? (over ? "over" : "on") : ""}"></i></div></div></div>`;
}

function timeline(inc, clauses){
  const rows = [];
  inc.timeline.forEach((e, ix) => {
    const fresh = isNew(inc.id, ix);
    // the per-step events of an agent turn (plan, ACCS gate, reply) are folded into that turn's single card
    const folded = e.title.startsWith("Agent proposes") || e.title === "ACCS gate" || e.title === "Reply to supplier";
    const prevEv = inc.timeline[ix - 1], afterDecision = e.title === "Reply to supplier" && prevEv && prevEv.kind === "decision" && prevEv.data && prevEv.data.action;
    if (afterDecision || (folded && e.title !== "Reply to supplier" && inc.timeline.slice(ix).some(x => x.kind === "decision" && x.data && x.data.action))) return;
    if (e.kind === "decision" && e.data && e.data.action) { rows.push(turnCard(e, clauses, fresh)); return; }
    const say = e.title.endsWith(" says");
    rows.push(`<li class="ev ${esc(e.kind)}${say ? " say" : ""}${fresh ? " new" : ""}"><span class="pt" aria-hidden="true"></span>
      <div><span class="kind">${esc(e.kind)}</span><span class="evt">${esc(e.title)}</span></div>
      ${e.detail?`<div class="det">${esc(e.detail)}</div>`:""}${e.chips.length?`<div class="chips">${e.chips.map(chip).join("")}</div>`:""}</li>`);
  });
  return `<ol class="tl">${rows.join("")}</ol>`;
}

// count the fact-check score up from 0 on a freshly arrived turn (a DOM-only effect: the HTML string is unchanged, so put() leaves it alone)
function countUp(){
  document.querySelectorAll(".ev.new .step .sv[data-count]").forEach(el => {
    if (el.dataset.done) return; el.dataset.done = "1";
    const to = parseFloat(el.dataset.count), t0 = performance.now() + 500, dur = 750;
    el.textContent = "0.00";
    (function f(now){ const p = Math.max(0, Math.min(1, (now - t0) / dur)), e = 1 - Math.pow(1 - p, 3); el.textContent = (to * e).toFixed(2); if (p < 1) requestAnimationFrame(f); })(performance.now());
  });
}

function render(s){
  last = s;
  put("meta", [
    s.mode === "live" ? `<span class="live">LIVE SANDBOX</span>` : `<span><b>SIMULATOR</b></span>`,
    `<span>AI <b>${esc(s.llm ? s.model : "offline heuristic")}</b></span>`,
    s.formal ? `<span class="ok" title="Exhaustive model check of the gate over every reachable state and every possible proposal">${s.formal.states} states &middot; ${s.formal.decisions.toLocaleString()} decisions &middot; ${s.formal.violations} violations</span>` : `<span>verifying&hellip;</span>`,
    `<span>policy <b>${esc(s.policy.digest.slice(0, 6))}</b></span>`
  ].join(""));
  $("mode").value = s.mode; $("llm").value = s.llm ? "1" : "0";
  put("scenarios", s.scenarios.map((x, i) => `<button class="scen ${s.running===x.name?"run":""}" data-s="${esc(x.name)}" ${(!x.available||s.running)?"disabled":""}>
      <span class="no">${String(i+1).padStart(2,"0")}</span><span class="t">${s.running===x.name?'<span class="spin"></span>':""}${esc(x.title)}</span><span class="k ${x.available && s.mode==="live" ? "live" : ""}">${x.available ? (s.mode==="live" ? "LIVE" : "SIM") : "SIM ONLY"}</span>
      <span class="d">${esc(x.blurb)}</span></button>`).join(""));
  $("poldig").textContent = "· " + s.policy.digest.slice(0, 6);

  const incs = s.incidents;
  const inc = incs.length ? (incs.find(i => i.id === selected) || incs[0]) : null;
  if (inc) selected = inc.id;
  const turnsAll = inc ? inc.timeline.filter(e => e.kind === "decision" && e.data && e.data.action) : [];
  const fired = turnsAll.length && !turnsAll[turnsAll.length-1].data.permit ? turnsAll[turnsAll.length-1].data.clause : null;
  put("policy", s.policy.clauses.map(c => `<div class="clause ${fired === c.id ? "fired" : ""}"><b>${esc(c.id.split("-")[0])}</b><span>${esc(c.text)}<i class="${c.overridable ? "ovr" : ""}">${c.overridable ? "a person may override" : "hard rule"}</i></span></div>`).join(""));
  put("err", s.error ? `<div class="err" role="alert">${esc(s.error)}</div>` : "");

  if (!inc){
    put("tabs", "");
    put("incident", `<div class="hero"><h3>An AI that proposes. Code that pays once.</h3><p>Pick a scenario. Watch the agent plan, get new information, change its mind, and stay safe.</p>
      <ol><li><span>01</span>AI proposes</li><li><span>02</span>Fact-check</li><li><span>03</span>Rulebook</li><li><span>04</span>Second opinion</li><li><span>05</span>Cashier pays once</li></ol></div>`);
    put("transfers", `<div class="empty">No incident yet.</div>`);
    put("safety", `<div class="empty">The invariant: never more than one live payment for an obligation.</div>`);
    put("caption", "");
  } else {
    put("tabs", incs.map(i => `<button class="tab ${i.id===selected?"on":""}" data-i="${esc(i.id)}">${esc(i.id)}</button>`).join(""));
    const atBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 80;
    const html = header(inc) + `<div class="facts"><span>Tenant <b>${esc(inc.tenant)}</b></span><span>Amount <b>${esc(inc.amount)} ${esc(inc.currency)}</b></span><span>${esc(inc.method)} fee <b>${esc(inc.fee)}</b></span><span>Wallet <b>${fmt(inc.wallet)}</b></span></div>` + timeline(inc, s.policy.clauses);
    known[inc.id] = true; // from here on, anything that arrives is "new"
    put("incident", html);
    countUp();
    if (atBottom && s.running) window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
    const rowsNew = new Set(); inc.transfers.forEach(t => { if (seenTr[t.id] === undefined) { seenTr[t.id] = Date.now(); } if (known[inc.id] && Date.now() - seenTr[t.id] < 1500 && seenTr._init) rowsNew.add(t.id); });
    seenTr._init = true;
    put("transfers", `<table><tr><th>Transfer</th><th>Status</th><th>request_id</th></tr>${inc.transfers.map(t => `<tr class="${rowsNew.has(t.id) ? "fresh" : ""}"><td class="mono">${esc(t.id.slice(0,8))}</td><td class="st ${statusClass(t.status)}">${esc(t.status)}${t.failure_type?`<div class="ft">${esc(t.failure_type)}</div>`:""}</td><td class="mono rid">${esc(t.request_id)}</td></tr>`).join("")}</table>`
      + `<div class="sub" style="margin-top:10px">Write-ahead attempts: ${inc.attempts.map(a=>`<span class="mono">#${a.attempt_no} ${esc(a.state)}</span>`).join(" &middot; ")||"none"}</div>`);
    const okLive = inc.live_count <= 1;
    put("safety", `<div class="big-n">${inc.live_count}<small>of 1 live payment allowed</small></div><div class="seg" style="justify-content:flex-start"><i class="${inc.live_count ? (okLive ? "on" : "over") : ""}"></i></div>
      <div class="kv"><span>Wallet (${esc(inc.tenant.slice(0,14))})</span><b>${fmt(inc.wallet)} ${esc(inc.currency)}</b><span>Fees paid so far</span><b>${fmt(inc.fees_paid)} ${esc(inc.currency)}</b><span>Payment attempts</span><b>${inc.attempts.length}</b></div>
      <ul class="inv"><li class="${okLive ? "" : "bad"}">at most one live payment</li><li>request ids minted by code</li><li>write-ahead record before any payment</li><li>this tenant's wallet only</li></ul>`);
    // presenter caption = the latest beat of the story
    const ev = inc.timeline[inc.timeline.length - 1];
    const lastDec = turnsAll[turnsAll.length - 1];
    const onTurn = lastDec && (ev.kind === "decision" || ev.title === "Reply to supplier" || ev.title === "ACCS gate" || ev.title.startsWith("Agent proposes"));
    const ct = onTurn ? (TONE[lastDec.data.decision] || ["", "", ev.title])[2] : ev.title;
    put("caption", `<div class="ct">${esc(ct)}</div><div class="cd">${esc(onTurn ? lastDec.data.note : ev.detail)}</div>`);
  }

  put("approvals", s.approvals.length ? s.approvals.map(a => `<div class="apr"><div class="sum">${esc(a.terms.summary)}</div>
      <div class="sub">Needs you because of <b>${esc(a.clause)}</b>. Approval is bound to exactly these terms; if anything changes it expires.</div>
      <dl><dt>Amount</dt><dd>${esc(a.terms.amount)} ${esc(a.terms.currency)} via ${esc(a.terms.method)}</dd><dt>Beneficiary</dt><dd class="mono">${esc(a.terms.beneficiary_id)}</dd>
      <dt>Tenant</dt><dd>${esc(a.terms.tenant)}</dd><dt>request_id</dt><dd class="mono">${esc(a.terms.request_id)}</dd>
      <dt>Latest transfer</dt><dd class="mono">${esc(a.terms.latest_transfer ? a.terms.latest_transfer.status + " " + (a.terms.latest_transfer.failure_type||"") : "")}</dd></dl>
      <div class="row"><button class="btn primary" data-a="${esc(a.id)}" data-v="approve">Approve &amp; send</button><button class="btn" data-a="${esc(a.id)}" data-v="deny">Deny</button></div></div>`).join("")
    : `<div class="empty">Nothing waiting. Hard rules (single live payment, tenant isolation, fee budget&hellip;) are never queued; they simply block.</div>`);
  put("webhook", s.webhook.log.length ? s.webhook.log.map(l => `<div class="mono">${esc(l[0])} &middot; ${esc(l[2])}</div>`).join("") : "Idle. Run &ldquo;Signed webhooks &times;3&rdquo;.");
  put("audit", s.audit.map(a => `<div>#${a.id} ${esc(a.kind)} ${esc(a.obligation_id)} ${esc(JSON.stringify(a.body).slice(0,260))}</div>`).join("") || "empty");
}

async function tick(){
  if (busy) return;
  try{ render(await api("/api/state")); }catch(e){ put("err", `<div class="err">Lost connection to the server.</div>`); }
}
document.addEventListener("click", async ev => {
  const b = ev.target.closest("button"); if(!b) return;
  if (b.id === "theme"){ const n = (document.documentElement.dataset.theme === "dark") ? "light" : "dark"; document.documentElement.dataset.theme = n; safeSet("theme", n); return; }
  if (b.id === "present"){ const on = !document.body.classList.contains("present"); document.body.classList.toggle("present", on); b.setAttribute("aria-pressed", on); safeSet("present", on ? "1" : "0"); return; }
  busy = true;
  try{
    if (b.dataset.s) { selected = null; const r = await api("/api/scenario/" + b.dataset.s, {}); if (r.error) alert(r.error); }
    else if (b.dataset.i) selected = b.dataset.i;
    else if (b.dataset.a) await api(`/api/approvals/${b.dataset.a}/${b.dataset.v}`, {by:"operator@demo"});
    else if (b.id === "reset"){ selected = null; await api("/api/reset", {}); }
  } finally { busy = false; }
  tick();
});
$("mode").onchange = async e => { selected=null; await api("/api/reset", {mode:e.target.value}); tick(); };
$("llm").onchange = async e => { selected=null; await api("/api/reset", {use_llm:e.target.value==="1"}); tick(); };
{ const q = new URLSearchParams(location.search); const t = q.get("theme") || safeGet("theme"); if (t) document.documentElement.dataset.theme = t;
  if (q.get("present") === "1" || safeGet("present") === "1") { document.body.classList.add("present"); $("present").setAttribute("aria-pressed", "true"); } }
tick(); setInterval(tick, 800);
</script>
</body>
</html>
